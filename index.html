<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Spesial untuk Fellycia ✨🌸</title>
    <style>
        /* Impor Font Kawaii dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Kiwi+Maru:wght@400;500&family=Quicksand:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fff0f5;
            background-image: radial-gradient(#ffc2d1 2px, transparent 2px);
            background-size: 26px 26px;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Container Kartu */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 30px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 4px solid #ffb3c6;
            position: relative;
            z-index: 10;
            animation: popIn 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* Stempel Jepang Kawaii di Pojok Kartu */
        .japanese-stamp {
            position: absolute;
            top: -15px;
            right: -10px;
            background-color: #ff4d6d;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Kiwi Maru', serif;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(255, 77, 109, 0.3);
            transform: rotate(12deg);
        }

        .header-jp {
            font-family: 'Kiwi Maru', serif;
            color: #ff758f;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        h1 {
            font-family: 'Fredoka', cursive;
            color: #c9184a;
            font-size: 21px;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            color: #ffb3c6;
        }

        .divider::before, .divider::after {
            content: '';
            height: 2px;
            width: 40px;
            background-color: #ffb3c6;
            border-radius: 2px;
        }

        p.pesan {
            color: #555;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Kotak Pengingat / Bento Box Style */
        .bento-box {
            background-color: #fff5f7;
            border: 2px dashed #ff8fa3;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 22px;
            text-align: left;
            position: relative;
        }

        .bento-title {
            font-family: 'Kiwi Maru', serif;
            font-size: 13px;
            color: #ff4d6d;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bento-box ul {
            list-style: none;
        }

        .bento-box li {
            margin: 8px 0;
            font-weight: 700;
            color: #800f2f;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13.5px;
        }

        /* Tombol */
        .btn {
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-family: 'Fredoka', cursive;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 77, 109, 0.35);
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.45);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Animasi Kelopak Sakura Gugur */
        .sakura {
            position: absolute;
            background-color: #ffb3c6;
            border-radius: 100% 0 100% 0;
            opacity: 0.7;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                top: 105%;
                transform: translateX(100px) rotate(360deg);
                opacity: 0.2;
            }
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Animasi Sakura (Elemen JavaScript akan membuat kelopak ini) -->
    <div id="sakura-container"></div>

    <div class="card">
        <div class="japanese-stamp">がんばって! (Ganbatte)</div>
        
        <div style="font-size: 45px; margin-bottom: 5px; margin-top: 10px;">🌸🍡</div>
        <div class="header-jp">おはようございます</div>
        <h1>Fellycia Aurelia Marsyalila ✨</h1>
        
        <div class="divider">🌸 🌸 🌸</div>
        
        <p class="pesan">
            Semangat yaa fell buat hari inii, jangan lupa bernafas dan senyum!! 🥰
        </p>

        <div class="bento-box">
            <div class="bento-title">🍱 Notes for tudeyy:</div>
            <ul>
                <li>🍙 Jangan lupa Sarapan dulu yaaa </li>
                <li>💊 Minum Vitamin biar gaa sakitt </li>
                <li>🍵 Minum Air Putih banyakk-banyakk </li>
            </ul>
        </div>

        <button class="btn" onclick="kirimPesan()">Klik Kalau Udah Siap Hari Ini! 🌸✨</button>
    </div>

    <script>
        // Fungsi Pop-up Tombol
        function kirimPesan() {
            alert("Sugoi!! 🌸 Have a nice dayy fell, Semangatt~🥰✨");
        }

        // Script Efek Kelopak Bunga Sakura Gugur
        const container = document.getElementById('sakura-container');
        const count = 25;

        for (let i = 0; i < count; i++) {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            
            // Random ukuran & posisi
            const size = Math.random() * 12 + 8;
            sakura.style.width = `${size}px`;
            sakura.style.height = `${size}px`;
            sakura.style.left = `${Math.random() * 100}vw`;
            
            // Random durasi & delay animasi
            const duration = Math.random() * 5 + 5;
            const delay = Math.random() * 5;
            sakura.style.animationDuration = `${duration}s`;
            sakura.style.animationDelay = `${delay}s`;
            
            document.body.appendChild(sakura);
        }
    </script>

</body>
</html>
