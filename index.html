<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Spesial untuk Fellycia ✨</title>
    <style>
        /* Impor Font Lucu dari Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffe6ee;
            background-image: radial-gradient(#ffb6c1 2px, transparent 2px);
            background-size: 24px 24px;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 4px solid #ffb3c6;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .avatar {
            font-size: 60px;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        h1 {
            font-family: 'Fredoka', cursive;
            color: #ff4d6d;
            font-size: 22px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .divider {
            height: 3px;
            width: 50px;
            background-color: #ffb3c6;
            margin: 0 auto 15px auto;
            border-radius: 10px;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .box-ingat {
            background-color: #fff0f3;
            border: 2px dashed #ff758f;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .box-ingat ul {
            list-style: none;
        }

        .box-ingat li {
            margin: 8px 0;
            font-weight: 700;
            color: #c9184a;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-family: 'Fredoka', cursive;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #c9184a;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Animasi */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">💖</div>
        <h1>Halo, Fellycia Aurelia Marsyalila! ✨</h1>
        <div class="divider"></div>
        
        <p>Semangat ya buat menjalanin hari ini! Jangan lupa tersenyum dan lakukan yang terbaik! 🌸</p>

        <div class="box-ingat">
            <ul>
                <li>🍳 Jangan lupa sarapan dulu ya!</li>
                <li>💊 Minum vitamin biar tetep fit!</li>
                <li>💧 Minum air putih yang cukup!</li>
            </ul>
        </div>

        <button class="btn" onclick="kirimCinta()">Klik Kalau Udah Sarapan! 🥞</button>
    </div>

    <script>
        function kirimCinta() {
            alert("Good Girl! Have a Good Day. Semangat terus ya Fell ! 🥰✨");
        }
    </script>

</body>
</html>
